<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario Poep Master!</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', cursive;
      background: linear-gradient(180deg, #5c94fc 0%, #80bfff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Header & Spaarpot */
    .header {
      width: 90%;
      max-width: 450px;
      margin-top: 20px;
      background: #e52521;
      border: 4px solid #000;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 8px 0 #8b0000;
      color: white;
    }

    .piggy-bank {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      font-size: 24px;
      background: #f8d800;
      color: #000;
      padding: 10px;
      border-radius: 10px;
      border: 3px solid #000;
      margin-top: 10px;
    }

    /* Grote Mario Munt */
    .coin-display-container {
      position: relative;
      margin: 30px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .big-coin-btn {
      width: 140px;
      height: 140px;
      background: radial-gradient(circle at 35% 35%, #fff677, #ffd700 60%, #cca100 100%);
      border-radius: 50%;
      border: 6px solid #e0a900;
      box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3), inset 5px 5px 10px rgba(255,255,255,0.8), 0 10px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: coinSpin 3s infinite linear;
      transition: transform 0.1s;
    }

    .big-coin-btn:active {
      transform: scale(0.95);
    }

    .big-coin-btn::after {
      content: '';
      width: 40px;
      height: 80px;
      border: 5px solid #b38600;
      border-radius: 50%;
    }

    @keyframes coinSpin {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }

    /* Actie Knoppen */
    .controls {
      display: flex;
      gap: 15px;
      width: 90%;
      max-width: 450px;
    }

    .btn {
      flex: 1;
      padding: 15px 10px;
      border: 4px solid #000;
      border-radius: 10px;
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      cursor: pointer;
      color: white;
      text-align: center;
      box-shadow: 0 6px 0 rgba(0,0,0,0.4);
    }

    .btn-add {
      background: #43b047;
      box-shadow: 0 6px 0 #286b2b;
    }

    .btn-remove {
      background: #e52521;
      box-shadow: 0 6px 0 #8b0000;
    }

    /* Voortgang en Doelen */
    .goals-container {
      width: 90%;
      max-width: 450px;
      margin-top: 25px;
      background: #f8d800;
      border: 4px solid #000;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 6px 0 #b89f00;
    }

    .goal-card {
      background: white;
      border: 3px solid #000;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
    }

    .progress-bar-bg {
      width: 100%;
      background: #ddd;
      height: 16px;
      border-radius: 8px;
      border: 2px solid #000;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #43b047;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Geanimeerde Vliegende Munt */
    .flying-coin {
      position: absolute;
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, #fff677, #ffd700);
      border-radius: 50%;
      border: 3px solid #000;
      pointer-events: none;
      z-index: 999;
      animation: flyUpAndFade 0.8s forwards ease-in-out;
    }

    @keyframes flyUpAndFade {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      50% {
        transform: translateY(-150px) scale(1.4);
      }
      100% {
        transform: translateY(-250px) scale(0.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div style="font-size: 14px; margin-bottom: 5px;">SUPER MARIO</div>
    <div style="font-size: 10px; color: #ffcccc;">POEP HERO! 🚽</div>
    <div class="piggy-bank" id="piggyBank">
      🪙 <span id="coinCount">0</span> MUNTEN
    </div>
  </div>

  <div class="coin-display-container">
    <div class="big-coin-btn" onclick="addCoin()"></div>
    <p style="font-size: 10px; margin-top: 15px; color: #000;">TIK VOOR MUNT!</p>
  </div>

  <div class="controls">
    <button class="btn btn-add" onclick="addCoin()">+1 OP TIJD!</button>
    <button class="btn btn-remove" onclick="removeCoin()">-1 TE LAAT</button>
  </div>

  <div class="goals-container">
    <div style="font-size: 12px; text-align: center;">🎯 VOLGENDE BELONING</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    
    <div class="goal-card">
      <span>🎁 Klein Cadeautje</span>
      <span>5 Munten</span>
    </div>
    <div class="goal-card">
      <span>🍦 Mario IJsje / Snack</span>
      <span>10 Munten</span>
    </div>
    <div class="goal-card">
      <span>🍄 Mario Speelgoed / Lego</span>
      <span>20 Munten</span>
    </div>
  </div>

  <script>
    let coins = parseInt(localStorage.getItem('mario_poop_coins')) || 0;
    const targetGoal = 10; // Instelbaar doel

    function updateUI() {
      document.getElementById('coinCount').innerText = coins;
      localStorage.setItem('mario_poop_coins', coins);

      // Update voortgangsbalk (gebaseerd op doel van 10 munten)
      let percentage = Math.min((coins / targetGoal) * 100, 100);
      document.getElementById('progressFill').style.width = percentage + '%';
    }

    function playAudioSound(freq, type, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function addCoin() {
      coins++;
      updateUI();

      // Geluidseffect (8-bit Mario Coin Sound imitatie)
      playAudioSound(987.77, 'sine', 0.1);
      setTimeout(() => playAudioSound(1318.51, 'sine', 0.4), 80);

      // Vliegende munt animatie
      const coinEl = document.createElement('div');
      coinEl.className = 'flying-coin';
      const container = document.querySelector('.coin-display-container');
      coinEl.style.left = '45%';
      coinEl.style.top = '20px';
      container.appendChild(coinEl);

      setTimeout(() => {
        coinEl.remove();
      }, 800);
    }

    function removeCoin() {
      if (coins > 0) {
        coins--;
        updateUI();
        // Buis-geluid / Foutmelding geluid
        playAudioSound(150, 'sawtooth', 0.3);
      }
    }

    // Initialiseren bij het laden van de pagina
    updateUI();
  </script>
</body>
</html>
